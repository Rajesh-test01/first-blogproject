{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h4>Search results for "{{ query }}"</h4>
    <hr>

    {% if results %}
        <div class="row">
            {% for blog in results %}
                <div class="col-md-4 mb-3">
                    <div class="card h-100">

                        {% if blog.image %}
                            <img src="{{ blog.image.url }}" class="card-img-top">
                        {% endif %}

                        <div class="card-body">
                            <h5>{{ blog.title }}</h5>
                            <p>{{ blog.short_desc|truncatechars:100 }}</p>

                            <a href="{% url 'blog_detail' blog.id %}" class="btn btn-primary btn-sm">
                                Read more
                            </a>
                        </div>

                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-danger">No results found.</p>
    {% endif %}

</div>

{% endblock %}
